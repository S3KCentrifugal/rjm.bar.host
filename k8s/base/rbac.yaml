apiVersion: v1
kind: ServiceAccount
metadata:
  name: rjm-bar-host
  labels:
    app.kubernetes.io/name: rjm-bar-host
    app.kubernetes.io/component: serviceaccount
    app.kubernetes.io/part-of: rjm-bar-host
# No Role or RoleBinding: neither the match runner nor SPADS reaches the
# Kubernetes API. They talk to the engine over loopback and write to volumes.
automountServiceAccountToken: false
