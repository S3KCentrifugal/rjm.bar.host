# Three local volumes on mcgill-data, shared by the match Job and SPADS. Both
# run on the one node, so ReadWriteOnce does not stop them sharing.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rjm-bar-host-data-pvc
  labels:
    app.kubernetes.io/name: rjm-bar-host
    app.kubernetes.io/component: content
    app.kubernetes.io/part-of: rjm-bar-host
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: data2
  resources:
    requests:
      # BAR's rapid pool plus a curated map set: a small fraction of a full map
      # mirror. SPADS downloads maps a room switches to, so this grows.
      storage: 40Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rjm-bar-host-out-pvc
  labels:
    app.kubernetes.io/name: rjm-bar-host
    app.kubernetes.io/component: output
    app.kubernetes.io/part-of: rjm-bar-host
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: data2
  resources:
    requests:
      # Everything a run produces: matches/<run>/{infolog.txt, engine-console.log,
      # demos/*.sdfz, result.json, script.txt, AI logs} and spads/{log,demos,...}.
      # Tens of MB per match; nothing prunes it yet.
      storage: 50Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rjm-bar-host-ai-pvc
  labels:
    app.kubernetes.io/name: rjm-bar-host
    app.kubernetes.io/component: custom-ai
    app.kubernetes.io/part-of: rjm-bar-host
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: data2
  resources:
    requests:
      # Custom AI folders, each <Name>/<version>/ with a Linux libSkirmishAI.so,
      # linked into the engine's AI/Skirmish at every start. The workloads
      # mount it read-only; load it with scripts/upload_ai.sh.
      storage: 5Gi
