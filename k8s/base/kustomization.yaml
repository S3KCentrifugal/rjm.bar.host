apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - rbac.yaml
  - network-policies.yaml
  - pvc.yaml
  - match-job.yaml
  - spads-deployment.yaml

configMapGenerator:
  - name: rjm-bar-host-match-config
    envs:
      - match.env
  - name: rjm-bar-host-spads-config
    envs:
      - spads.env

# The match Job references its ConfigMap by name and a Job's pod template is
# immutable, so a hash suffix would strand a finished Job against a ConfigMap
# that no longer exists. SPADS picks config changes up because the pipeline
# restarts it when spads.env changes.
generatorOptions:
  disableNameSuffixHash: true

labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/part-of: rjm-bar-host
      app.kubernetes.io/managed-by: kustomize
