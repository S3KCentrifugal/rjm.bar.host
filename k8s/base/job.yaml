apiVersion: batch/v1
kind: Job
metadata:
  name: barhost-match
  labels:
    app.kubernetes.io/name: barhost-match
    app.kubernetes.io/component: match-runner
    app.kubernetes.io/part-of: barhost
spec:
  # One attempt. A failed match is a result worth looking at, not something to
  # paper over by replaying it -- and a retry would overwrite the infolog that
  # explains the failure.
  backoffLimit: 0
  # Keep finished pods around long enough to read logs, then reap them. The
  # replay and result.json live on the runs volume, so nothing is lost.
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: barhost-match
        app.kubernetes.io/component: match-runner
        app.kubernetes.io/part-of: barhost
    spec:
      restartPolicy: Never
      serviceAccountName: barhost
      imagePullSecrets:
        - name: mcgill-k8s-pull-2026
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Populates the content volume with the pinned game and map set.
        # Idempotent: rapid skips anything already in the pool, so on a warm
        # volume this is a few seconds of HTTP HEADs.
        - name: fetch-content
          image: ghcr.io/S3KCentrifugal/barhost-match:latest
          args: ["fetch-content"]
          envFrom:
            - configMapRef:
                name: barhost-match-config
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { cpu: "200m", memory: "256Mi" }
            limits: { cpu: "2000m", memory: "1Gi" }
          volumeMounts:
            - name: spring-data
              mountPath: /spring-data
      containers:
        - name: match
          image: ghcr.io/S3KCentrifugal/barhost-match:latest
          args: ["match"]
          envFrom:
            - configMapRef:
                name: barhost-match-config
          env:
            # Each run writes into its own directory so the volume accumulates
            # a comparable history instead of overwriting the last result.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: BARHOST_WRITE_DIR
              value: /out/$(POD_NAME)
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # Measured, not guessed -- see design §7.4 and scripts/measure_match.py.
          # On a 16-core/24-thread host, 8 BARb on All That Glitters with the
          # configured settings (Legion, co-op, +50% AI income) held ~2.8 cores
          # and peaked at 6.0 GiB; on bare engine defaults the same 8 AI cost
          # ~2.4 cores and 4.4 GiB, and 16 AI cost ~2.9 cores. Settings
          # that make the AI build more units cost more than adding AI does. CPU barely moves with
          # AI count because AI updates run serially on the sim thread
          # (EngineOutHandler.cpp:85-88, from Game.cpp:1748) and CircuitAI's
          # worker pool is process-wide rather than per-instance
          # (Scheduler.cpp:36).
          #
          # The CPU limit is therefore about not being throttled, not about
          # speed: match wall-clock is bounded by single-core performance.
          # Memory is what actually kills a pod, and it grows with match length
          # -- hence the wide gap between request and limit.
          #
          # Burstable on purpose. This shares one node with the cluster's eight
          # database instances, so a batch job reserves modestly and bursts into
          # whatever headroom exists.
          resources:
            requests: { cpu: "2000m", memory: "8Gi" }
            limits: { cpu: "6000m", memory: "16Gi" }
          volumeMounts:
            - name: spring-data
              mountPath: /spring-data
            - name: runs
              mountPath: /out
      volumes:
        - name: spring-data
          persistentVolumeClaim:
            claimName: barhost-spring-data-pvc
        - name: runs
          persistentVolumeClaim:
            claimName: barhost-runs-pvc
