apiVersion: v1
kind: PersistentVolume
metadata:
  name: rjm-bar-host-data-pv-test
  labels:
    app.kubernetes.io/name: rjm-bar-host
    app.kubernetes.io/component: data
    app.kubernetes.io/part-of: rjm-bar-host
    environment: test
spec:
  capacity:
    storage: 40Gi
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: data2
  claimRef:
    namespace: bar-test
    name: rjm-bar-host-data-pvc
  local:
    path: /mnt/data2/k8s-volumes/rjm-bar-host/test/data
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values: [mcgill-data]
