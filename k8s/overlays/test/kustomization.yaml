apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: bar-test

resources:
  - namespace.yaml
  - ../../base/
  - persistent-volumes.yaml

# One reusable image for every environment (design section 9): the tag, not
# the name, says which build runs here. CI replaces IMAGE_TAG with the commit.
images:
  - name: ghcr.io/s3kcentrifugal/rjm-bar-host
    newTag: IMAGE_TAG

patches:
  # Bind each claim to this environment's PV. data2 is WaitForFirstConsumer
  # with no provisioner, so without this and the PV's claimRef a claim can bind
  # across environments.
  - target:
      kind: PersistentVolumeClaim
      name: rjm-bar-host-data-pvc
    patch: |-
      - op: add
        path: /spec/volumeName
        value: rjm-bar-host-data-pv-test
  - target:
      kind: PersistentVolumeClaim
      name: rjm-bar-host-out-pvc
    patch: |-
      - op: add
        path: /spec/volumeName
        value: rjm-bar-host-out-pv-test
  - target:
      kind: PersistentVolumeClaim
      name: rjm-bar-host-ai-pvc
    patch: |-
      - op: add
        path: /spec/volumeName
        value: rjm-bar-host-ai-pv-test
