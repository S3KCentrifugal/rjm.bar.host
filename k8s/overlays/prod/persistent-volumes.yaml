apiVersion: v1
kind: PersistentVolume
metadata:
  name: barhost-spring-data-pv-prod
spec:
  capacity:
    storage: 20Gi
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: data2
  claimRef:
    namespace: barhost-prod
    name: barhost-spring-data-pvc
  local:
    path: /mnt/data2/k8s-volumes/barhost/prod/spring-data
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values: [mcgill-data]
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: barhost-runs-pv-prod
spec:
  capacity:
    storage: 20Gi
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: data2
  claimRef:
    namespace: barhost-prod
    name: barhost-runs-pvc
  local:
    path: /mnt/data2/k8s-volumes/barhost/prod/runs
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values: [mcgill-data]
