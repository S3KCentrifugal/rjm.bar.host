apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: bar-prod

resources:
  - namespace.yaml
  - ../../base/
  - persistent-volumes.yaml

# One reusable image for every environment (design section 9): the tag, not
# the name, says which build runs here. CI replaces IMAGE_TAG with the commit.
images:
  - name: ghcr.io/s3kcentrifugal/rjm-bar-host
    newTag: IMAGE_TAG

# SPADS runs with hostNetwork, so test and prod share mcgill-data's ports.
# Prod takes the next pair; forward UDP 8462 on the router for prod players.
configMapGenerator:
  - name: rjm-bar-host-spads-config
    behavior: merge
    literals:
      - SPADS_GAME_PORT=8462
      - SPADS_AUTOHOST_PORT=8464
      - SPADS_BATTLE_NAME=rjm-bar-host room

patches:
  - target:
      kind: Deployment
      name: rjm-bar-host-spads
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/ports/0/containerPort
        value: 8462
  # Bind each claim to this environment's PV. data2 is WaitForFirstConsumer
  # with no provisioner, so without this and the PV's claimRef a claim can bind
  # across environments.
  - target:
      kind: PersistentVolumeClaim
      name: rjm-bar-host-data-pvc
    patch: |-
      - op: add
        path: /spec/volumeName
        value: rjm-bar-host-data-pv-prod
  - target:
      kind: PersistentVolumeClaim
      name: rjm-bar-host-out-pvc
    patch: |-
      - op: add
        path: /spec/volumeName
        value: rjm-bar-host-out-pv-prod
  - target:
      kind: PersistentVolumeClaim
      name: rjm-bar-host-ai-pvc
    patch: |-
      - op: add
        path: /spec/volumeName
        value: rjm-bar-host-ai-pv-prod
