# SPADS global settings (not reloaded by !reloadConf)
# Lobby connection (Teiserver speaks the SpringLobby protocol; TLS via STARTTLS on the same port)
lobbyHost:%(ENV{SPADS_LOBBY_HOST}|server4.beyondallreason.info)%
lobbyPort:%(ENV{SPADS_LOBBY_PORT}|8200)%
# on for BAR's server; the offline end-to-end test sets it off for its fake lobby
lobbyTls:%(ENV{SPADS_LOBBY_TLS}|on)%
lobbyReconnectDelay:30
lobbyFollowRedirect:1
lobbyLogin:%ENV{SPADS_LOBBY_LOGIN}%
lobbyPassword:%ENV{SPADS_LOBBY_PASSWORD}%

# Local network configuration
# '*' = autohost is not on a LAN shared with players (avoid advertising the container IP)
localLanIp:*
# UDP port of the engine<->SPADS autohost interface; SPADS always binds it to 127.0.0.1
autoHostPort:%(ENV{SPADS_AUTOHOST_PORT}|8454)%
# empty = engine auto-detects; try 0.0.0.0 if hosting fails because of IPv6 in the container
forceHostIp:%ENV{SPADS_FORCE_HOST_IP}%

# SPADS directories (etcDir may be read-only; varDir/instanceDir/logDir must exist and be writable)
etcDir:/opt/rjm-host/spads/etc
varDir:%(ENV{BARHOST_OUT_DIR}|/bar/out)%/spads/var
instanceDir:
logDir:%(ENV{BARHOST_OUT_DIR}|/bar/out)%/spads/log

# Data sharing between instances (single instance -> private files in instanceDir/varDir)
bansData:private
mapInfoCacheData:private
savedBoxesData:private
trustedLobbyCertificatesData:private
preferencesData:private
sharedDataRefreshDelay:5
dataDumpDelay:60
userDataRetention:0;0;0

# Auto-update disabled (image is immutable)
autoUpdateRelease:
autoUpdateDelay:0
autoRestartForUpdate:off

# Engine (custom install, no SPADS engine auto-management)
autoManagedSpringVersion:
autoManagedSpringDir:spring
unitsyncDir:%(ENV{BAR_ENGINE_DIR}|/bar/engine/recoil_2026.07.04)%
springServer:%(ENV{BAR_ENGINE_DIR}|/bar/engine/recoil_2026.07.04)%/spring-headless
springServerType:headless
springDataDir:%(ENV{BARHOST_DATA_DIR}|/bar/data)%:%(ENV{BAR_ENGINE_DIR}|/bar/engine/recoil_2026.07.04)%
autoReloadArchivesMinDelay:30
sequentialUnitsync:0
autoLearnMaps:0
# Engine settings file for spring-headless (--config); empty = engine defaults.
springConfig:%ENV{SPADS_SPRING_CONFIG}%

# Lobby data transfer limits
sendRecordPeriod:5
maxBytesSent:49000
maxLowPrioBytesSent:48000
maxChatMessageLength:1024
maxAutoHostMsgLength:240
promoteDelay:600

# Anti-flood
msgFloodAutoKick:7;7
statusFloodAutoKick:8;8
kickFloodAutoBan:2;120;5
cmdFloodAutoIgnore:4;4;2
reCallVoteDelay:10
floodImmuneLevel:100

# Logging
lobbyInterfaceLogLevel:4
autoHostInterfaceLogLevel:4
updaterLogLevel:4
spadsLogLevel:4
simpleEventLogLevel:4
logChanChat:0
logChanJoinLeave:0
logBattleChat:1
logBattleJoinLeave:1
logGameChat:1
logGameJoinLeave:1
logGameServerMsg:1
logPvChat:1

# Alerts
alertLevel:130
alertDelay:6
alertDuration:72

# Channels (none: private use)
masterChannel:
opOnMasterChannel:0
broadcastChannels:
promoteChannels:
promoteMsg:%pplayer(s) needed for battle "%b" [%o, %a] (%u)

# Presets
defaultPreset:botlab
restoreDefaultPresetDelay:30

# Votes
voteTime:45
minVoteParticipation:50
majorityVoteMargin:0
awayVoteDelay:20

# Plugins: Autopilot (docker/spads/plugins) automates the room -- bot bonus,
# auto-start, pre-game force start, and the control socket used by spadsctl.
pluginsDir:/opt/rjm-host/spads/plugins
autoLoadPlugins:%(ENV{SPADS_PLUGINS}|Autopilot)%

# Misc
autoLockClients:64
autoSaveBoxes:1
botsRank:3
springieEmulation:off
allowSettingsShortcut:1
kickBanDuration:300
privacyTrustLevel:130
maxSpecsImmuneLevel:100
useWin32Process:0
eventModel:auto
maxChildProcesses:16

################################################################################
# Global presets (first value of each setting = default, others = allowed values)
################################################################################

# Humans vs bots (nbTeams 1): every human is balanced onto one team and every
# bot onto team 1 (spads.pl balanceBattle, nbTeams == 1), and autoAddBotNb is
# the size of the bot team, kept topped up automatically (spads.pl:6683).
[botlab]
description:Co-op: humans against server-side AI bots
preset:botlab
hostingPreset:default
battlePreset:default

# Map rotation disabled (map is set explicitly)
rotationType:map
rotationDelay:0
rotationEndGame:off
rotationEmpty:off
rotationManual:random|order

mapList:all
map:%ENV{SPADS_MAP}%
autoLoadMapPreset:0
hideMapPresets:0
allowGhostMaps:0

# Automatic features. Starting is the Autopilot plugin's job: SPADS's own
# autoStart never starts a room with bots in it.
# autoBalance must be "advanced": "on" balances only a full room (every
# human slot taken, spads.pl:6758), so a co-op room with fewer humans would
# never be balanced and SPADS would refuse to start it.
autoCallvote:1
autoLockRunningBattle:0
autoLock:off|on
autoSpecExtraPlayers:0
autoStart:off
autoStop:gameOver|off
autoBalance:advanced|on|off
autoFixColors:off|on|advanced
autoBlockBalance:0
autoBlockColors:0
colorSensitivity:55
balanceMode:skill|random
clanMode:tag;pref
idShareMode:off|manual|all
nbPlayerById:1
teamSize:%(ENV{SPADS_MAX_HUMANS}|8)%|1-16
nbTeams:1|1-16
extraBox:0
minPlayers:1
minTeamSize:1
autoAddBotNb:%(ENV{SPADS_AUTO_ADD_BOTS}|8)%|0-16
localBots:%(ENV{SPADS_LOCAL_BOTS}|SMRTBARb1 0 SMRTBARb;SMRTBARb2 1 SMRTBARb;SMRTBARb3 0 SMRTBARb;SMRTBARb4 1 SMRTBARb;SMRTBARb5 0 SMRTBARb;SMRTBARb6 1 SMRTBARb;SMRTBARb7 0 SMRTBARb;SMRTBARb8 1 SMRTBARb)%
speedControl:1|2

# Bots and specs limits
maxBots:16|0-16
maxRemoteBots:16|0-16
maxLocalBots:16|0-16
allowedLocalAIs:%(ENV{SPADS_ALLOWED_AIS}|SMRTBARb;BARb)%
maxSpecs:|0-32
midGameSpecLevel:0
noSpecChat:0|1
noSpecDraw:0|1

# Default preferences
autoSetVoteMode:1
voteMode:normal
votePvMsgDelay:0
voteRingDelay:0
minRingDelay:20
handleSuggestions:0
rankMode:account
skillMode:rank
shareId:
ircColors:0
spoofProtection:warn

# Messages
welcomeMsg:Hi %u, this room hosts custom AI bots.
welcomeMsgInGame:Hi %u, a game is in progress since %t.
mapLink:
ghostMapLink:
advertMsg:
advertDelay:0

# Miscellaneous
banList:empty
commandsFile:commands.conf
freeSettings:
allowModOptionsValues:1
allowMapOptionsValues:1
unlockSpecDelay:5;30
forwardLobbyToGame:1
endGameCommand:/opt/rjm-host/spads/archive_game.sh %gameId %startTimestamp %endTimestamp %result
endGameCommandEnv:
endGameCommandMsg:
endGameAwards:0
