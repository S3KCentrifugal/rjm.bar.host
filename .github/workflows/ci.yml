# Checks for pull requests -- feature branches into test, and test into prod:
# lint, render every overlay, and build and smoke-test the image without
# publishing it. Pushes to test and prod are built, smoke-tested, published and
# deployed by deploy.yml.
name: ci

on:
  pull_request:
    branches: [test, prod]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Shell scripts
        run: shellcheck -S warning docker/runtime/entrypoint.sh docker/spads/*.sh scripts/*.sh

      - name: Python
        run: python3 -m py_compile scripts/*.py

      - name: Kustomize renders both overlays
        run: |
          for env in test prod; do
            kubectl kustomize "k8s/overlays/$env" > "/tmp/$env.yaml"
            echo "$env: $(grep -c '^kind:' "/tmp/$env.yaml") objects"
            grep -q "namespace: bar-$env" "/tmp/$env.yaml"
            # every PV must be pre-bound to this environment's claim
            test "$(grep -c "namespace: bar-$env" "/tmp/$env.yaml")" -gt 3
          done

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Engine pin
        id: pin
        run: |
          set -a; . ./config/engine.pin; set +a
          echo "engine_version=$ENGINE_VERSION" >> "$GITHUB_OUTPUT"
          echo "engine_sha256=$ENGINE_SHA256" >> "$GITHUB_OUTPUT"

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/runtime/Dockerfile
          target: runtime
          load: true
          tags: rjm-host:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            ENGINE_VERSION=${{ steps.pin.outputs.engine_version }}
            ENGINE_SHA256=${{ steps.pin.outputs.engine_sha256 }}

      - name: Smoke test
        run: scripts/smoke_test.sh rjm-host:ci
