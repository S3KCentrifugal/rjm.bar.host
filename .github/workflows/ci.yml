# Checks for pull requests -- feature branches into test, and test into prod:
# lint, static manifest checks, build the image, smoke test, unit tests.
# Nothing is published. Pushes to test and prod are built, tested and
# published by publish.yml; the full lobby end-to-end test is e2e.yml.
name: ci

on:
  pull_request:
    branches: [test, prod]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Shell scripts
        run: shellcheck -S warning docker/runtime/entrypoint.sh docker/spads/*.sh scripts/*.sh tests/*.sh tests/e2e/*.sh tests/lan/*.sh

      - name: Python
        run: python3 -m py_compile scripts/*.py docker/spads/spadsctl tests/unit/*.py tests/e2e/*.py tests/static/*.py

      - name: Static manifest checks
        run: |
          python3 -c 'import yaml' 2>/dev/null || pip install --quiet pyyaml
          python3 tests/static/check_manifests.py

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Engine pin
        id: pin
        run: |
          set -a; . ./config/engine.pin; set +a
          echo "engine_version=$ENGINE_VERSION" >> "$GITHUB_OUTPUT"
          echo "engine_sha256=$ENGINE_SHA256" >> "$GITHUB_OUTPUT"

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/runtime/Dockerfile
          target: runtime
          load: true
          tags: rjm-bar-host:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            ENGINE_VERSION=${{ steps.pin.outputs.engine_version }}
            ENGINE_SHA256=${{ steps.pin.outputs.engine_sha256 }}

      - name: Smoke test
        run: scripts/smoke_test.sh rjm-bar-host:ci

      - name: Unit tests
        run: |
          python3 -c 'import yaml' 2>/dev/null || pip install --quiet pyyaml
          tests/run_unit.sh rjm-bar-host:ci
