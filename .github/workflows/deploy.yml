# Build the reusable rjm-host image, publish it to GHCR, and deploy it to the
# k3s cluster: set-env -> build -> deploy (configure-k8s-pipeline skill).
#
# The image is published whether or not the cluster deploy can happen, because
# other repositories consume it directly.
#
#   push test|prod        build if the image changed since the last push, deploy,
#                         run a match
#   workflow_dispatch     must be run *from* the branch it deploys (test or
#                         prod); optionally override the match's AI
#   repository_dispatch   `ai-updated` from an AI repository: rerun the match on
#                         test, from the test branch, with the image already
#                         deployed there and the AI named in the payload
#
# Branches: `test` is the default branch and deploys on every push. `prod` is
# updated only by a squash-merged pull request from test, by hand.
#
# Image tags: an image is keyed by the commit's *tree* (tree-<hash>): identical
# source, identical image. A squash merge to prod has a new commit hash but the
# same tree as the tested test commit, so prod retags the image test ran rather
# than rebuilding it. <sha> and tree-<hash> tags are written once, never re-pushed.
name: deploy

on:
  push:
    branches: [test, prod]
  workflow_dispatch:
    inputs:
      force_build:
        description: Build this commit's image even if nothing image-related changed (never overwrites an existing <sha> tag)
        type: boolean
        default: false
      ai_archives:
        description: Override BARHOST_AI_ARCHIVES for this run's match (e.g. github:S3KCentrifugal/CircuitAI@v1.961-test)
        type: string
        default: ""
      interrupt_lobby:
        description: Restart SPADS even if a game is in progress on it
        type: boolean
        default: false
  repository_dispatch:
    types: [ai-updated]

concurrency:
  # One deploy per environment at a time; never cancel one mid-flight, since
  # a cancelled deploy can leave a Job deleted and not yet recreated.
  group: deploy-${{ github.event_name == 'repository_dispatch' && 'test' || github.ref_name }}
  cancel-in-progress: false

env:
  IMAGE_NAME: rjm-host

jobs:
  set-env:
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.env.outputs.ref }}
      tree: ${{ steps.env.outputs.tree }}
      environment: ${{ steps.env.outputs.environment }}
      namespace: ${{ steps.env.outputs.namespace }}
      image: ${{ steps.env.outputs.image }}
      engine_version: ${{ steps.pin.outputs.engine_version }}
      engine_sha256: ${{ steps.pin.outputs.engine_sha256 }}
      ai_archives: ${{ steps.ai.outputs.ai_archives }}
      build_needed: ${{ steps.changed.outputs.build_needed }}
      can_deploy: ${{ steps.secrets.outputs.can_deploy }}
    steps:
      # A repository_dispatch runs on the default branch, which is test; check
      # it out explicitly anyway so a change of default can never deploy an
      # unreviewed branch.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'repository_dispatch' && 'test' || github.sha }}
          fetch-depth: 0

      - name: Resolve environment
        id: env
        run: |
          case "${{ github.event_name }}" in
            repository_dispatch) ENVIRONMENT="test" ;;
            *)                   ENVIRONMENT="${{ github.ref_name }}" ;;
          esac
          if [ "$ENVIRONMENT" != "test" ] && [ "$ENVIRONMENT" != "prod" ]; then
            echo "::error::refusing to deploy from '$ENVIRONMENT': run this from the test or prod branch"
            exit 1
          fi
          # GHCR repository names must be lowercase; the account name is not.
          OWNER="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          {
            echo "ref=$(git rev-parse HEAD)"
            echo "tree=$(git rev-parse 'HEAD^{tree}')"
            echo "environment=$ENVIRONMENT"
            echo "namespace=bar-$ENVIRONMENT"
            echo "image=ghcr.io/$OWNER/$IMAGE_NAME"
          } >> "$GITHUB_OUTPUT"
          echo "deploying $(git rev-parse --short HEAD) to $ENVIRONMENT"

      - name: Read the engine pin
        id: pin
        run: |
          set -a; . ./config/engine.pin; set +a
          echo "engine_version=$ENGINE_VERSION" >> "$GITHUB_OUTPUT"
          echo "engine_sha256=$ENGINE_SHA256" >> "$GITHUB_OUTPUT"
          echo "engine recoil_$ENGINE_VERSION"

      - name: Resolve the AI for this run's match
        id: ai
        env:
          # Untrusted text from an input or a dispatch payload: it reaches the
          # script through the environment, never by interpolation, and is
          # restricted to characters that are inert in the sed that uses it.
          FROM_INPUT: ${{ github.event.inputs.ai_archives }}
          FROM_DISPATCH: ${{ github.event.client_payload.ai_archives }}
        run: |
          AI="${FROM_INPUT:-$FROM_DISPATCH}"
          case "$AI" in
            *[!A-Za-z0-9:/@#._*+=\;?%,\ -]*) echo "::error::ai_archives contains a character outside [A-Za-z0-9:/@#._*+=;?%, -]"; exit 1 ;;
          esac
          echo "ai_archives=$AI" >> "$GITHUB_OUTPUT"
          echo "ai override: ${AI:-(none; match.env decides)}"

      - name: Detect image-relevant changes
        id: changed
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          NEEDED=false
          case "${{ github.event_name }}" in
            push)
              # Everything pushed, not just the last commit.
              if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
                 || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
                NEEDED=true   # new branch or rewritten history: no base to diff
              elif git diff --name-only "$BEFORE" HEAD | grep -qE '^(docker/|scripts/|config/engine\.pin)'; then
                NEEDED=true
              elif git log --format=%B "$BEFORE..HEAD" | grep -q '\[force-build\]'; then
                NEEDED=true
              fi ;;
            # The build job only builds if this commit has no image yet;
            # otherwise it retags. Cheap, and it makes a manual run self-healing.
            workflow_dispatch) NEEDED=true ;;
            # Rerun the match on what test already runs.
            repository_dispatch) NEEDED=false ;;
          esac
          echo "build_needed=$NEEDED" >> "$GITHUB_OUTPUT"
          echo "build needed: $NEEDED"

      - name: Check the cluster secrets are configured
        id: secrets
        env:
          HAVE_KUBE: ${{ secrets.KUBE_CONFIG_DATA != '' }}
          HAVE_WG: ${{ secrets.WG_PRIVATE_KEY != '' && secrets.WG_ENDPOINT != '' }}
          HAVE_PULL: ${{ secrets.GHCR_PULL_TOKEN != '' }}
        run: |
          if [ "$HAVE_KUBE" = "true" ] && [ "$HAVE_WG" = "true" ] && [ "$HAVE_PULL" = "true" ]; then
            echo "can_deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "can_deploy=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Cluster secrets are not all set (KUBE_CONFIG_DATA, WG_*, GHCR_PULL_TOKEN); the image is published but not deployed. See README 'Cluster secrets'."
          fi

  build:
    runs-on: ubuntu-latest
    needs: set-env
    if: needs.set-env.outputs.build_needed == 'true'
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ${{ needs.set-env.outputs.image }}
      SHA: ${{ needs.set-env.outputs.ref }}
      TREE: tree-${{ needs.set-env.outputs.tree }}
      ENVIRONMENT: ${{ needs.set-env.outputs.environment }}
      ENGINE_VERSION: ${{ needs.set-env.outputs.engine_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.set-env.outputs.ref }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      # Images are keyed by source tree. If this tree already has an image -- a
      # squash-merge of tested test code into prod, or a rerun -- reuse it
      # rather than rebuild it.
      - name: Does this source already have an image?
        id: exists
        run: |
          if docker buildx imagetools inspect "$IMAGE:$TREE" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "$IMAGE:$TREE exists; it will be retagged, not rebuilt"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # Build once into the runner's daemon and prove it works before anything
      # is pushed.
      - name: Build
        if: steps.exists.outputs.exists != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/runtime/Dockerfile
          target: runtime
          load: true
          tags: rjm-host:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            ENGINE_VERSION=${{ needs.set-env.outputs.engine_version }}
            ENGINE_SHA256=${{ needs.set-env.outputs.engine_sha256 }}

      - name: Smoke test
        if: steps.exists.outputs.exists != 'true'
        run: scripts/smoke_test.sh rjm-host:ci

      - name: Unit tests
        if: steps.exists.outputs.exists != 'true'
        run: |
          python3 -c 'import yaml' 2>/dev/null || pip install --quiet pyyaml
          tests/run_unit.sh rjm-host:ci

      - name: Push the source tag
        if: steps.exists.outputs.exists != 'true'
        run: |
          docker tag rjm-host:ci "$IMAGE:$TREE"
          docker push "$IMAGE:$TREE"

      # Every other tag points at the source's image: this commit's <sha>
      # (unless it already exists), <env>, and on prod recoil-<engine>, latest.
      - name: Tag this commit's image
        run: |
          TAGS="$ENVIRONMENT"
          # <sha> is written once: never repoint an existing commit tag.
          if ! docker buildx imagetools inspect "$IMAGE:$SHA" > /dev/null 2>&1; then
            TAGS="$SHA $TAGS"
          fi
          [ "$ENVIRONMENT" = "prod" ] && TAGS="$TAGS recoil-$ENGINE_VERSION latest"
          ARGS=""
          for t in $TAGS; do ARGS="$ARGS -t $IMAGE:$t"; done
          # shellcheck disable=SC2086
          docker buildx imagetools create $ARGS "$IMAGE:$TREE"
          {
            echo "### Published"
            echo "- \`$IMAGE:$TREE\`$([ "${{ steps.exists.outputs.exists }}" = true ] && echo ' (existing image for this source, reused)')"
            for t in $TAGS; do echo "- \`$IMAGE:$t\`"; done
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    runs-on: ubuntu-latest
    needs: [set-env, build]
    if: >-
      always() && needs.set-env.result == 'success' &&
      (needs.build.result == 'success' || needs.build.result == 'skipped') &&
      needs.set-env.outputs.can_deploy == 'true'
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/mcgill-software/mcgill-deployer:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GHCR_PULL_TOKEN }}
      options: --privileged
    env:
      ENVIRONMENT: ${{ needs.set-env.outputs.environment }}
      NAMESPACE: ${{ needs.set-env.outputs.namespace }}
      IMAGE: ${{ needs.set-env.outputs.image }}
      AI_ARCHIVES: ${{ needs.set-env.outputs.ai_archives }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.set-env.outputs.ref }}

      # 1. VPN
      - name: Configure WireGuard
        env:
          WG_PRIVATE_KEY: ${{ secrets.WG_PRIVATE_KEY }}
          WG_CLIENT_ADDRESS: ${{ secrets.WG_CLIENT_ADDRESS }}
          WG_SERVER_PUBLIC_KEY: ${{ secrets.WG_SERVER_PUBLIC_KEY }}
          WG_ENDPOINT: ${{ secrets.WG_ENDPOINT }}
          WG_ALLOWED_IPS: ${{ secrets.WG_ALLOWED_IPS }}
        run: |
          mkdir -p /etc/wireguard
          cat > /etc/wireguard/wg0.conf << EOF
          [Interface]
          PrivateKey = ${WG_PRIVATE_KEY}
          Address = ${WG_CLIENT_ADDRESS}

          [Peer]
          PublicKey = ${WG_SERVER_PUBLIC_KEY}
          Endpoint = ${WG_ENDPOINT}
          AllowedIPs = ${WG_ALLOWED_IPS}
          PersistentKeepalive = 25
          EOF
          chmod 600 /etc/wireguard/wg0.conf
          wg-quick up wg0

      # 2. kubectl
      - name: Configure kubectl
        env:
          KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG_DATA }}
        run: |
          mkdir -p ~/.kube
          echo "$KUBE_CONFIG_DATA" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config
          kubectl version --request-timeout=20s

      # 3. namespace
      - name: Ensure namespace
        run: kubectl create namespace "$NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -

      # 4. pull secret (the image is a private package)
      - name: Ensure GHCR pull secret
        env:
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
        run: |
          kubectl create secret docker-registry mcgill-k8s-pull-2026 \
            --docker-server=ghcr.io \
            --docker-username="${{ github.repository_owner }}" \
            --docker-password="$GHCR_PULL_TOKEN" \
            --namespace "$NAMESPACE" \
            --dry-run=client -o yaml | kubectl apply -f -

      # 5. resolve the image tag
      - name: Resolve image tag
        id: tag
        run: |
          if [ "${{ needs.build.result }}" = "success" ]; then
            TAG="${{ needs.set-env.outputs.ref }}"
          else
            # Nothing built: reuse what is deployed, so a config-only change
            # never silently pulls a moving tag.
            TAG=$(kubectl get job rjm-host-match -n "$NAMESPACE" -o jsonpath='{.spec.template.spec.containers[0].image}' 2>/dev/null | sed 's/.*://')
            [ -n "$TAG" ] || TAG=$(kubectl get deployment rjm-host-spads -n "$NAMESPACE" -o jsonpath='{.spec.template.spec.containers[0].image}' 2>/dev/null | sed 's/.*://')
            [ -n "$TAG" ] || { echo "::error::nothing deployed to reuse; run this workflow manually with force_build"; exit 1; }
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Using $IMAGE:$TAG"

      # 5b. lobby credentials. When the repository has this environment's
      #     LOBBY_* secrets, they become the rjm-host-secrets Secret; changing
      #     one in GitHub and redeploying updates it. Without them, a Secret
      #     created by hand (docs/setup.md) is left exactly as it is. Updating a
      #     Secret restarts nothing by itself; the render step below folds its
      #     version into the SPADS hash, so SPADS restarts only through the
      #     mid-game guard.
      - name: Sync lobby credentials
        env:
          LOBBY_LOGIN: ${{ secrets[format('LOBBY_LOGIN_{0}', needs.set-env.outputs.environment == 'prod' && 'PROD' || 'TEST')] }}
          LOBBY_PASSWORD: ${{ secrets[format('LOBBY_PASSWORD_{0}', needs.set-env.outputs.environment == 'prod' && 'PROD' || 'TEST')] }}
          LOBBY_OWNER: ${{ secrets[format('LOBBY_OWNER_{0}', needs.set-env.outputs.environment == 'prod' && 'PROD' || 'TEST')] }}
          LOBBY_ROOM_PASSWORD: ${{ secrets[format('LOBBY_ROOM_PASSWORD_{0}', needs.set-env.outputs.environment == 'prod' && 'PROD' || 'TEST')] }}
        run: |
          if [ -z "$LOBBY_LOGIN$LOBBY_PASSWORD$LOBBY_OWNER" ]; then
            echo "No LOBBY_*_${ENVIRONMENT^^} secrets in the repository; leaving any existing rjm-host-secrets untouched."
            exit 0
          fi
          for v in LOBBY_LOGIN LOBBY_PASSWORD LOBBY_OWNER; do
            [ -n "${!v}" ] || { echo "::error::${v}_${ENVIRONMENT^^} is not set; set all of LOBBY_LOGIN, LOBBY_PASSWORD and LOBBY_OWNER for $ENVIRONMENT"; exit 1; }
          done
          # Values go through files, never command-line arguments.
          d=$(mktemp -d); chmod 700 "$d"
          printf '%s' "$LOBBY_LOGIN"    > "$d/SPADS_LOBBY_LOGIN"
          printf '%s' "$LOBBY_PASSWORD" > "$d/SPADS_LOBBY_PASSWORD"
          printf '%s' "$LOBBY_OWNER"    > "$d/SPADS_OWNER_LOBBY_LOGIN"
          printf '%s' "${LOBBY_ROOM_PASSWORD:-*}" > "$d/SPADS_BATTLE_PASSWORD"
          kubectl create secret generic rjm-host-secrets -n "$NAMESPACE" --from-file="$d" \
            --dry-run=client -o yaml \
            | kubectl label --local -f - -o yaml app.kubernetes.io/part-of=rjm-host app.kubernetes.io/component=secrets \
            | kubectl apply -f -
          rm -rf "$d"
          echo "rjm-host-secrets synced from GitHub secrets (room: $([ -n "$LOBBY_ROOM_PASSWORD" ] && [ "$LOBBY_ROOM_PASSWORD" != '*' ] && echo private || echo public))"

      # 6. render once: tag, this run's AI override, SPADS replicas, and the
      #    SPADS template hash. What is checked below is exactly what is applied.
      - name: Render manifests
        id: render
        run: |
          sed -i "s|newTag: IMAGE_TAG|newTag: ${{ steps.tag.outputs.tag }}|" "k8s/overlays/$ENVIRONMENT/kustomization.yaml"
          if [ -n "$AI_ARCHIVES" ]; then
            sed -i "s|^BARHOST_AI_ARCHIVES=.*|BARHOST_AI_ARCHIVES=$AI_ARCHIVES|" k8s/base/match.env
          fi
          # Without lobby credentials SPADS cannot start: hold it at zero rather
          # than create a pod that crash-loops.
          SECRET_VERSION=$(kubectl get secret rjm-host-secrets -n "$NAMESPACE" -o jsonpath='{.metadata.resourceVersion}' 2>/dev/null || true)
          if [ -n "$SECRET_VERSION" ]; then
            SPADS=1
          else
            SPADS=0
            echo "::warning::rjm-host-secrets is missing in $NAMESPACE, so SPADS is held at 0 replicas. Set the LOBBY_*_${ENVIRONMENT^^} repository secrets (docs/setup.md), then redeploy."
          fi
          sed -i "s|replicas: 1 # SPADS_REPLICAS|replicas: $SPADS|" k8s/base/spads-deployment.yaml
          kubectl kustomize "k8s/overlays/$ENVIRONMENT/" > /tmp/rendered.yaml
          # Hash everything the SPADS Deployment is rendered from, after the
          # substitutions above: its manifest, its ConfigMap source, the base and
          # overlay kustomizations (image tag, per-environment ports), and the
          # credentials Secret's version. Any change -- image, resources, probe,
          # ports, config, credentials -- changes the hash, and the hash lives in
          # the pod template, so SPADS restarts exactly when something about it
          # changed, and the guard below can tell.
          HASH=$( { cat k8s/base/spads-deployment.yaml k8s/base/spads.env k8s/base/kustomization.yaml \
                        "k8s/overlays/$ENVIRONMENT"/*.yaml; echo "secret=$SECRET_VERSION"; } \
                  | sha256sum | cut -c1-16)
          sed -i "s|SPADS_CONFIG_HASH|h-$HASH|" /tmp/rendered.yaml
          grep -n "image: ghcr\|rjm-host/config-hash" /tmp/rendered.yaml
          echo "spads_replicas=$SPADS" >> "$GITHUB_OUTPUT"
          echo "spads_hash=h-$HASH" >> "$GITHUB_OUTPUT"

      # 7. guards, before anything is changed: never interrupt a running game
      - name: Refuse to disturb a running match
        run: |
          ACTIVE=$(kubectl get job rjm-host-match -n "$NAMESPACE" -o jsonpath='{.status.active}' 2>/dev/null || true)
          if [ -n "$ACTIVE" ] && [ "$ACTIVE" != "0" ]; then
            echo "::error::A match is still running in $NAMESPACE. Wait for it, or delete it deliberately: kubectl delete job rjm-host-match -n $NAMESPACE"
            exit 1
          fi
          echo "No match in flight."

      # SPADS runs games for people. A changed pod template restarts it
      # (Recreate), which would end a game in progress. Fail closed: if the pod
      # cannot be inspected, assume a game is running.
      - name: Refuse to restart SPADS mid-game
        if: github.event.inputs.interrupt_lobby != 'true'
        run: |
          POD=$(kubectl get pod -n "$NAMESPACE" -l app.kubernetes.io/name=rjm-host-spads -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)
          [ -n "$POD" ] || { echo "SPADS has no pod; nothing to interrupt."; exit 0; }
          LIVE=$(kubectl get deployment rjm-host-spads -n "$NAMESPACE" -o jsonpath='{.spec.template.metadata.annotations.rjm-host/config-hash}')
          if [ "$LIVE" = "${{ steps.render.outputs.spads_hash }}" ] && [ "${{ steps.render.outputs.spads_replicas }}" = "1" ]; then
            echo "SPADS is unchanged; applying will not restart it."; exit 0
          fi
          PHASE=$(kubectl get pod "$POD" -n "$NAMESPACE" -o jsonpath='{.status.phase}')
          [ "$PHASE" = "Running" ] || { echo "SPADS pod is $PHASE; no game can be running."; exit 0; }
          STATE=$(kubectl exec -n "$NAMESPACE" "$POD" -c spads -- sh -c \
            'for p in /proc/[0-9]*; do case "$(cat "$p/comm" 2>/dev/null)" in spring-headless*) echo busy; exit 0;; esac; done; echo idle' \
            2>/dev/null || echo unknown)
          if [ "$STATE" != "idle" ]; then
            echo "::error::SPADS would restart and a game may be in progress (state: $STATE). Rerun when it ends, or run manually with interrupt_lobby."
            exit 1
          fi
          echo "SPADS is idle; safe to restart."

      # 8. host directories for the local PVs, owned by the image's uid
      - name: Ensure host directories
        run: |
          kubectl delete pod rjm-host-mkdir -n "$NAMESPACE" --ignore-not-found --wait=true
          cat <<EOF | kubectl apply -n "$NAMESPACE" -f -
          apiVersion: v1
          kind: Pod
          metadata:
            name: rjm-host-mkdir
            labels:
              app.kubernetes.io/name: rjm-host-mkdir
              app.kubernetes.io/part-of: rjm-host
          spec:
            restartPolicy: Never
            nodeSelector:
              kubernetes.io/hostname: mcgill-data
            containers:
              - name: mkdir
                image: busybox:1.36
                securityContext:
                  runAsUser: 0
                command:
                  - sh
                  - -c
                  - |
                    set -eux
                    base=/mnt/data2/k8s-volumes/rjm-host/$ENVIRONMENT
                    mkdir -p "\$base/data" "\$base/out" "\$base/ai"
                    chown -R 10001:10001 "\$base"
                    df -h /mnt/data2
                resources:
                  requests: { cpu: "10m", memory: "16Mi" }
                  limits: { cpu: "100m", memory: "64Mi" }
                volumeMounts:
                  - name: data2
                    mountPath: /mnt/data2
            volumes:
              - name: data2
                hostPath:
                  path: /mnt/data2
                  type: Directory
          EOF
          PHASE=""
          for _ in $(seq 60); do
            PHASE=$(kubectl get pod rjm-host-mkdir -n "$NAMESPACE" -o jsonpath='{.status.phase}' 2>/dev/null || true)
            case "$PHASE" in Succeeded|Failed) break ;; esac
            sleep 2
          done
          kubectl logs rjm-host-mkdir -n "$NAMESPACE" || true
          kubectl delete pod rjm-host-mkdir -n "$NAMESPACE" --ignore-not-found
          [ "$PHASE" = "Succeeded" ] || { echo "::error::host directory setup failed (phase=$PHASE)"; exit 1; }

      # 9. clean up Released PVs so their claims can rebind
      - name: Release stale PVs
        run: |
          for p in data out ai; do
            pv="rjm-host-$p-pv-$ENVIRONMENT"
            PHASE=$(kubectl get pv "$pv" -o jsonpath='{.status.phase}' 2>/dev/null || true)
            if [ "$PHASE" = "Released" ]; then
              echo "deleting Released PV $pv (Retain keeps the data on disk)"
              kubectl delete pv "$pv"
            fi
          done

      # 10. a Job's pod template is immutable: replace it rather than patch it
      - name: Remove the previous match Job
        run: kubectl delete job rjm-host-match -n "$NAMESPACE" --ignore-not-found --wait=true

      # 11. apply
      - name: Apply manifests
        run: kubectl apply -f /tmp/rendered.yaml

      - name: Wait for SPADS
        id: spads
        run: |
          if [ "${{ steps.render.outputs.spads_replicas }}" = "1" ]; then
            kubectl rollout status deployment/rjm-host-spads -n "$NAMESPACE" --timeout=900s
            echo "running=true" >> "$GITHUB_OUTPUT"
          else
            echo "running=false (no rjm-host-secrets)" >> "$GITHUB_OUTPUT"
          fi

      # 12. wait for the match, then report
      - name: Wait for the match
        id: wait
        run: |
          # A cold content fetch (~3.5 GB) plus a full match. The container
          # enforces its own BARHOST_TIMEOUT_SECONDS inside this.
          TIMEOUT=5400
          END=$(( $(date +%s) + TIMEOUT ))
          STATUS=timeout
          while [ "$(date +%s)" -lt "$END" ]; do
            if [ "$(kubectl get job rjm-host-match -n "$NAMESPACE" -o jsonpath='{.status.succeeded}' 2>/dev/null)" = "1" ]; then
              STATUS=succeeded; break
            fi
            if [ -n "$(kubectl get job rjm-host-match -n "$NAMESPACE" -o jsonpath='{.status.failed}' 2>/dev/null)" ]; then
              STATUS=failed; break
            fi
            sleep 20
          done
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "match: $STATUS"

      - name: Match log
        if: always() && steps.wait.outcome != 'skipped'
        run: |
          kubectl logs -n "$NAMESPACE" job/rjm-host-match -c match --tail=200 2>/dev/null | grep -v '^\[Progress\]' || true
          POD=$(kubectl get pod -n "$NAMESPACE" -l job-name=rjm-host-match -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)
          {
            echo "### Match on $NAMESPACE"
            echo "- status: ${{ steps.wait.outputs.status }}"
            echo "- output: \`/mnt/data2/k8s-volumes/rjm-host/$ENVIRONMENT/out/matches/$POD\` on mcgill-data"
            echo "- SPADS running: ${{ steps.spads.outputs.running }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail if the match did not succeed
        if: always() && steps.wait.outcome == 'success' && steps.wait.outputs.status != 'succeeded'
        run: |
          kubectl describe job rjm-host-match -n "$NAMESPACE" || true
          echo "::error::match did not complete: ${{ steps.wait.outputs.status }}"
          exit 1

      - name: Tear down VPN
        if: always()
        run: wg-quick down wg0 || true
