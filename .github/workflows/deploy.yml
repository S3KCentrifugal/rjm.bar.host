name: Build and run a match

# Branch name is the environment, matching the cluster pipeline standard.
# `main` never deploys.
#
# repository_dispatch is the interesting trigger here: it lets a push in the AI
# repository kick a match in this one, which is the whole point of the pipeline.
# Send it with:
#   gh api repos/S3KCentrifugal/rjm.bar.host/dispatches \
#     -f event_type=ai-updated -f 'client_payload[ai_ref]=<sha>'
on:
  push:
    branches: [test, prod]
  repository_dispatch:
    types: [ai-updated]
  workflow_dispatch:
    inputs:
      ai_ref:
        description: 'AI ref to build (branch, tag or SHA). Blank = config/engine.pin'
        type: string
        required: false
      environment:
        description: 'Target environment'
        type: choice
        options: [test, prod]
        default: test
      force_build:
        description: 'Rebuild the image even if nothing changed'
        type: boolean
        default: false

concurrency:
  # One match at a time per environment. The node has a single set of volumes
  # and one CPU budget; overlapping runs would contend for both and make the
  # timings meaningless.
  group: barhost-${{ github.event.inputs.environment || github.ref_name }}
  cancel-in-progress: false

jobs:
  set-env:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.env.outputs.environment }}
      namespace: ${{ steps.env.outputs.namespace }}
      engine_repo: ${{ steps.pin.outputs.engine_repo }}
      engine_ref: ${{ steps.pin.outputs.engine_ref }}
      ai_repo: ${{ steps.pin.outputs.ai_repo }}
      ai_ref: ${{ steps.pin.outputs.ai_ref }}
      ai_dir_name: ${{ steps.pin.outputs.ai_dir_name }}
      ai_version: ${{ steps.pin.outputs.ai_version }}
      image_changed: ${{ steps.changed.outputs.image_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Resolve environment
        id: env
        run: |
          case "${{ github.event_name }}" in
            workflow_dispatch)    ENVIRONMENT="${{ github.event.inputs.environment }}" ;;
            repository_dispatch)  ENVIRONMENT="test" ;;
            *)                    ENVIRONMENT="${{ github.ref_name }}" ;;
          esac
          if [ "$ENVIRONMENT" != "test" ] && [ "$ENVIRONMENT" != "prod" ]; then
            echo "refusing to deploy from '$ENVIRONMENT'; use the test or prod branch" >&2
            exit 1
          fi
          echo "environment=$ENVIRONMENT" >> "$GITHUB_OUTPUT"
          echo "namespace=barhost-$ENVIRONMENT" >> "$GITHUB_OUTPUT"

      - name: Read pins
        id: pin
        run: |
          set -a; . ./config/engine.pin; set +a
          # An explicitly requested AI ref beats the pinned default.
          REQ_REF="${{ github.event.inputs.ai_ref }}"
          [ -n "$REQ_REF" ] || REQ_REF="${{ github.event.client_payload.ai_ref }}"
          [ -n "$REQ_REF" ] || REQ_REF="$AI_REF"
          {
            echo "engine_repo=$ENGINE_REPO"
            echo "engine_ref=$ENGINE_REF"
            echo "ai_repo=$AI_REPO"
            echo "ai_ref=$REQ_REF"
            echo "ai_dir_name=$AI_DIR_NAME"
            echo "ai_version=$AI_VERSION"
          } >> "$GITHUB_OUTPUT"
          echo "engine $ENGINE_REPO@$ENGINE_REF"
          echo "ai     $AI_REPO@$REQ_REF"

      - name: Detect image-relevant changes
        id: changed
        run: |
          CHANGED=false
          if [ "${{ github.event_name }}" != "push" ]; then
            # A dispatch always means "build this AI", so never skip.
            CHANGED=true
          elif git diff --name-only HEAD~1 HEAD \
               | grep -qE '^(docker/|scripts/|config/engine\.pin)'; then
            CHANGED=true
          fi
          if [ "${{ github.event.inputs.force_build }}" = "true" ]; then
            CHANGED=true
          fi
          echo "image_changed=$CHANGED" >> "$GITHUB_OUTPUT"

  build:
    runs-on: ubuntu-latest
    needs: set-env
    if: needs.set-env.outputs.image_changed == 'true'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4

      - name: Checkout the engine
        uses: actions/checkout@v4
        with:
          repository: ${{ needs.set-env.outputs.engine_repo }}
          ref: ${{ needs.set-env.outputs.engine_ref }}
          path: engine-src
          submodules: recursive
          fetch-depth: 1

      - name: Checkout the AI
        uses: actions/checkout@v4
        with:
          repository: ${{ needs.set-env.outputs.ai_repo }}
          ref: ${{ needs.set-env.outputs.ai_ref }}
          path: ai-src
          # The AI repository is private, so the workflow's own GITHUB_TOKEN
          # cannot read it. AI_REPO_TOKEN is a PAT with `repo` scope.
          token: ${{ secrets.AI_REPO_TOKEN }}
          fetch-depth: 1

      # No separate compile step: docker/runtime/Dockerfile is a multi-stage
      # build, so the same definition runs here and on a laptop. Layer caching
      # does the heavy lifting -- the engine-build stage is keyed on the engine
      # source, so an AI-only change reuses it and recompiles only the AI.
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push the runtime image
        uses: docker/build-push-action@v6
        with:
          # The main context supplies scripts/run_match.py and the entrypoint;
          # the two source trees arrive as named contexts so neither has to be
          # copied into it.
          context: .
          file: docker/runtime/Dockerfile
          target: runtime
          build-contexts: |
            engine-src=engine-src
            ai-src=ai-src
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/barhost-match-${{ needs.set-env.outputs.environment }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            AI_DIR_NAME=${{ needs.set-env.outputs.ai_dir_name }}
            AI_VERSION=${{ needs.set-env.outputs.ai_version }}

  deploy:
    runs-on: ubuntu-latest
    needs: [set-env, build]
    if: always() && needs.set-env.result == 'success' && (needs.build.result == 'success' || needs.build.result == 'skipped')
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/S3KCentrifugal/mcgill-deployer:latest
      options: --privileged
    env:
      ENVIRONMENT: ${{ needs.set-env.outputs.environment }}
      NAMESPACE: ${{ needs.set-env.outputs.namespace }}
    steps:
      - uses: actions/checkout@v4

      # 1. VPN
      - name: Configure WireGuard
        env:
          WG_PRIVATE_KEY: ${{ secrets.WG_PRIVATE_KEY }}
          WG_CLIENT_ADDRESS: ${{ secrets.WG_CLIENT_ADDRESS }}
          WG_SERVER_PUBLIC_KEY: ${{ secrets.WG_SERVER_PUBLIC_KEY }}
          WG_ENDPOINT: ${{ secrets.WG_ENDPOINT }}
          WG_ALLOWED_IPS: ${{ secrets.WG_ALLOWED_IPS }}
        run: |
          mkdir -p /etc/wireguard
          cat > /etc/wireguard/wg0.conf << EOF
          [Interface]
          PrivateKey = ${WG_PRIVATE_KEY}
          Address = ${WG_CLIENT_ADDRESS}

          [Peer]
          PublicKey = ${WG_SERVER_PUBLIC_KEY}
          Endpoint = ${WG_ENDPOINT}
          AllowedIPs = ${WG_ALLOWED_IPS}
          PersistentKeepalive = 25
          EOF
          wg-quick up wg0

      # 2. kubectl
      - name: Configure kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG_DATA }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config
          kubectl version --request-timeout=20s

      # 3. namespace
      - name: Ensure namespace
        run: |
          kubectl create namespace "$NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -

      # 4. pull secret
      - name: Ensure GHCR pull secret
        run: |
          kubectl create secret docker-registry mcgill-k8s-pull-2026 \
            --docker-server=ghcr.io \
            --docker-username="${{ github.actor }}" \
            --docker-password="${{ secrets.GHCR_PULL_TOKEN }}" \
            --namespace "$NAMESPACE" \
            --dry-run=client -o yaml | kubectl apply -f -

      # 5. guard: never interrupt a match in progress
      - name: Refuse to disturb a running match
        run: |
          ACTIVE=$(kubectl get job barhost-match -n "$NAMESPACE" \
            -o jsonpath='{.status.active}' 2>/dev/null || true)
          if [ -n "$ACTIVE" ] && [ "$ACTIVE" != "0" ]; then
            echo "A match is still running in $NAMESPACE (active=$ACTIVE)." >&2
            echo "Wait for it, or delete the job deliberately:" >&2
            echo "  kubectl delete job barhost-match -n $NAMESPACE" >&2
            exit 1
          fi
          echo "No match in flight."

      # 6. host directories for the local PVs
      - name: Ensure host directories
        run: |
          kubectl delete pod barhost-mkdir -n "$NAMESPACE" --ignore-not-found --wait=true
          cat <<EOF | kubectl apply -n "$NAMESPACE" -f -
          apiVersion: v1
          kind: Pod
          metadata:
            name: barhost-mkdir
          spec:
            restartPolicy: Never
            nodeSelector:
              kubernetes.io/hostname: mcgill-data
            containers:
              - name: mkdir
                image: busybox:1.36
                securityContext:
                  runAsUser: 0
                command:
                  - sh
                  - -c
                  - |
                    set -eux
                    base=/mnt/data2/k8s-volumes/barhost/$ENVIRONMENT
                    mkdir -p "\$base/spring-data" "\$base/runs"
                    # The container runs as uid 10001 (see the Dockerfile), so
                    # the local volumes must be writable by it.
                    chown -R 10001:10001 "\$base"
                    df -h /mnt/data2
                volumeMounts:
                  - name: data2
                    mountPath: /mnt/data2
            volumes:
              - name: data2
                hostPath:
                  path: /mnt/data2
                  type: Directory
          EOF
          kubectl wait --for=condition=Ready pod/barhost-mkdir -n "$NAMESPACE" --timeout=120s || true
          for _ in $(seq 60); do
            PHASE=$(kubectl get pod barhost-mkdir -n "$NAMESPACE" -o jsonpath='{.status.phase}' 2>/dev/null || true)
            case "$PHASE" in Succeeded|Failed) break ;; esac
            sleep 2
          done
          kubectl logs barhost-mkdir -n "$NAMESPACE" || true
          PHASE=$(kubectl get pod barhost-mkdir -n "$NAMESPACE" -o jsonpath='{.status.phase}' 2>/dev/null || true)
          kubectl delete pod barhost-mkdir -n "$NAMESPACE" --ignore-not-found
          [ "$PHASE" = "Succeeded" ] || { echo "host directory setup failed (phase=$PHASE)" >&2; exit 1; }

      # 7. resolve the image tag
      - name: Resolve image tag
        id: tag
        run: |
          if [ "${{ needs.build.result }}" = "success" ]; then
            TAG="${{ github.sha }}"
          else
            # Nothing rebuilt: reuse whatever the last job ran, so a config-only
            # change does not silently pull `latest`.
            TAG=$(kubectl get job barhost-match -n "$NAMESPACE" \
              -o jsonpath='{.spec.template.spec.containers[0].image}' 2>/dev/null \
              | sed 's/.*://')
            [ -n "$TAG" ] || { echo "no previous image to reuse; rerun with force_build" >&2; exit 1; }
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Using image tag $TAG"

      # 8. clean up Released PVs so claims can rebind
      - name: Release stale PVs
        run: |
          for pv in barhost-spring-data-pv-$ENVIRONMENT barhost-runs-pv-$ENVIRONMENT; do
            PHASE=$(kubectl get pv "$pv" -o jsonpath='{.status.phase}' 2>/dev/null || true)
            if [ "$PHASE" = "Released" ]; then
              echo "deleting Released PV $pv (Retain policy keeps the data on disk)"
              kubectl delete pv "$pv"
            fi
          done

      # 9. substitute the tag
      - name: Substitute IMAGE_TAG
        run: |
          sed -i "s|newTag: IMAGE_TAG|newTag: ${{ steps.tag.outputs.tag }}|" \
            "k8s/overlays/$ENVIRONMENT/kustomization.yaml"
          grep -n "newTag:" "k8s/overlays/$ENVIRONMENT/kustomization.yaml"

      # 10. a Job's pod template is immutable, so replace rather than patch
      - name: Remove the previous job
        run: |
          kubectl delete job barhost-match -n "$NAMESPACE" --ignore-not-found --wait=true

      # 11. apply
      - name: Apply manifests
        run: |
          kubectl apply -k "k8s/overlays/$ENVIRONMENT/"

      # 12. wait for the match, then report
      - name: Wait for the match
        id: wait
        run: |
          # Content fetch on a cold volume plus a full match: generous, and the
          # container enforces its own BARHOST_TIMEOUT_SECONDS budget inside this.
          TIMEOUT=5400
          echo "waiting up to ${TIMEOUT}s for barhost-match"
          END=$(( $(date +%s) + TIMEOUT ))
          STATUS=""
          while [ "$(date +%s)" -lt "$END" ]; do
            if [ "$(kubectl get job barhost-match -n "$NAMESPACE" -o jsonpath='{.status.succeeded}' 2>/dev/null)" = "1" ]; then
              STATUS=succeeded; break
            fi
            if [ -n "$(kubectl get job barhost-match -n "$NAMESPACE" -o jsonpath='{.status.failed}' 2>/dev/null)" ]; then
              STATUS=failed; break
            fi
            sleep 15
          done
          [ -n "$STATUS" ] || STATUS=timeout
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "job status: $STATUS"

      - name: Match log
        if: always()
        run: |
          kubectl logs -n "$NAMESPACE" job/barhost-match --all-containers --tail=300 || true

      - name: Fail if the match did not succeed
        if: always() && steps.wait.outputs.status != 'succeeded'
        run: |
          echo "match did not complete successfully: ${{ steps.wait.outputs.status }}" >&2
          kubectl describe job barhost-match -n "$NAMESPACE" || true
          exit 1

      - name: Tear down VPN
        if: always()
        run: wg-quick down wg0 || true
